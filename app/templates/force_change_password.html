<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Nova Senha — Opendce</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="auth-bg">
      <div class="auth-blob"></div>
      <div class="auth-blob"></div>
      <div class="auth-blob"></div>
    </div>

    <div class="auth-card">
      <div class="auth-logo">
        <img
          src="/static/images/logo.png"
          alt="Opendce"
          style="
            height: 50px;
            width: auto;
            max-width: 240px;
            object-fit: contain;
            margin-bottom: 0.5rem;
          "
        />
        <h1>Crie sua senha</h1>
        <p>Defina uma nova senha segura para continuar</p>
      </div>

      {% if error %}
      <div class="alert-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form
        id="changeForm"
        method="POST"
        action="/force-change-password"
        novalidate
      >
        <div class="form-group">
          <label class="form-label" for="nova_senha">Nova Senha</label>
          <div class="input-wrapper">
            <i class="input-icon fa-solid fa-lock"></i>
            <input
              id="nova_senha"
              name="nova_senha"
              type="password"
              class="form-input has-toggle"
              placeholder="Mínimo 8 caracteres"
              minlength="8"
              required
              autofocus
            />
            <button
              type="button"
              class="toggle-password"
              id="t1"
              aria-label="Mostrar senha"
            >
              <i class="fa-solid fa-eye" id="i1"></i>
            </button>
          </div>
          <div
            id="strengthBar"
            style="
              height: 3px;
              border-radius: 2px;
              background: var(--border);
              margin-top: 6px;
              overflow: hidden;
            "
          >
            <div
              id="strengthFill"
              style="
                height: 100%;
                width: 0;
                transition:
                  width 0.3s,
                  background 0.3s;
                border-radius: 2px;
              "
            ></div>
          </div>
          <span
            id="strengthLabel"
            style="
              font-size: 0.72rem;
              color: var(--text-muted);
              margin-top: 3px;
            "
          ></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmar_senha"
            >Confirmar Senha</label
          >
          <div class="input-wrapper">
            <i class="input-icon fa-solid fa-lock-open"></i>
            <input
              id="confirmar_senha"
              name="confirmar_senha"
              type="password"
              class="form-input has-toggle"
              placeholder="Repita a senha"
              required
            />
            <button
              type="button"
              class="toggle-password"
              id="t2"
              aria-label="Mostrar confirmação"
            >
              <i class="fa-solid fa-eye" id="i2"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span id="btnText">Salvar nova senha</span>
        </button>
      </form>
    </div>

    <script>
      function makeToggle(btnId, iconId, inputId) {
        document.getElementById(btnId).addEventListener("click", () => {
          const el = document.getElementById(inputId);
          const isPass = el.type === "password";
          el.type = isPass ? "text" : "password";
          document.getElementById(iconId).className = isPass
            ? "fa-solid fa-eye-slash"
            : "fa-solid fa-eye";
        });
      }
      makeToggle("t1", "i1", "nova_senha");
      makeToggle("t2", "i2", "confirmar_senha");

      document
        .getElementById("nova_senha")
        .addEventListener("input", function () {
          const v = this.value;
          let score = 0;
          if (v.length >= 8) score++;
          if (/[A-Z]/.test(v)) score++;
          if (/[0-9]/.test(v)) score++;
          if (/[^a-zA-Z0-9]/.test(v)) score++;
          const colors = ["", "#ef4444", "#f59e0b", "#34d399", "#22c55e"];
          const labels = ["", "Fraca", "Razoável", "Boa", "Forte"];
          const fill = document.getElementById("strengthFill");
          fill.style.width = score * 25 + "%";
          fill.style.background = colors[score] || "transparent";
          document.getElementById("strengthLabel").textContent =
            labels[score] || "";
        });

      document
        .getElementById("changeForm")
        .addEventListener("submit", function (e) {
          const p1 = document.getElementById("nova_senha").value;
          const p2 = document.getElementById("confirmar_senha").value;
          if (p1.length < 8 || p1 !== p2) return;
          const btn = document.getElementById("submitBtn");
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>Salvando…';
        });
    </script>
  </body>
</html>
